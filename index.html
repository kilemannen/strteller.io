<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Størrelsen teller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: ett instrumentpanel-kort, måler øverst, avlesninger under, statuslinje for tilkoblingstype */
:root{
  --bg:#0b1015; --panel:#141b22; --ink:#e7edf2; --muted:#8a99a6; --line:#26313b;
  --dl:#3d9bff; --ul:#a07bff; --ok:#3fbf74; --warn:#e3a33a; --bad:#ef5d5d;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header h1{font:700 2rem/1 var(--display);letter-spacing:.02em;margin:0;text-transform:uppercase}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.status{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:.9rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.status.ok .dot{background:var(--ok)} .status.warn .dot{background:var(--warn)} .status.bad .dot{background:var(--bad)}
.status label{display:flex;gap:6px;align-items:center;margin-top:6px;cursor:pointer}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:14px}
svg{width:100%;height:auto;display:block}
.tick{fill:var(--muted);font:500 13px var(--mono)}
.big{fill:var(--ink);font:700 64px var(--display)}
.unit{fill:var(--muted);font:500 13px var(--mono);letter-spacing:.08em}
.phase{fill:var(--muted);font:600 13px var(--body);letter-spacing:.12em;text-transform:uppercase}
#needle{transition:transform .25s ease-out}
@media (prefers-reduced-motion:reduce){#needle{transition:none}}
.readouts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ro{border-top:3px solid var(--line);padding-top:6px}
.ro.dl{border-color:var(--dl)} .ro.ul{border-color:var(--ul)}
.ro span{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.when{margin-top:-6px;font:.78rem var(--mono);color:var(--muted)}
.ro b{font:700 clamp(1.3rem,6vw,1.7rem)/1.1 var(--display);font-variant-numeric:tabular-nums}
.ro small{color:var(--muted);font-family:var(--mono);font-size:.75rem}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:600 1rem var(--body);border-radius:10px;padding:12px 16px;border:1px solid var(--dl);background:var(--dl);color:#fff;cursor:pointer;flex:1}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ul);outline-offset:2px}
.info{margin:0;display:grid;gap:6px;padding:12px 0;border-block:1px solid var(--line)}
.info div{display:flex;justify-content:space-between;gap:12px}
.info dt{color:var(--muted);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.info dd{margin:0;font:500 .9rem var(--mono);text-align:right;min-width:0;overflow-wrap:anywhere}
.log{font:.8rem/1.5 var(--mono);color:var(--muted);min-height:1.5em;overflow-wrap:anywhere;white-space:pre-line}
.log.err{color:var(--bad)}
</style>
</head>
<body>
<main>
  <header>
    <h1>Størrelsen teller <span style="font:500 .8rem var(--mono);color:var(--muted);letter-spacing:0;text-transform:none;vertical-align:middle">v1.6.0</span></h1>
    <p>Måler nedlasting og opplasting på linja di. Kun på WiFi eller kabel.</p>
  </header>

  <div class="status" id="status">
    <div class="dot"></div>
    <div id="statusText">Sjekker tilkobling…</div>
  </div>

  <section class="panel">
    <svg viewBox="26 24 268 236" aria-label="Speedometer">
      <path id="track" fill="none" stroke="var(--line)" stroke-width="14" stroke-linecap="round"/>
      <path id="arc" fill="none" stroke="var(--dl)" stroke-width="14" stroke-linecap="round"/>
      <g id="ticks"></g>
      <g id="needle" style="transform-origin:160px 160px">
        <path d="M156 160 L160 62 L164 160 Z" fill="var(--ink)"/>
      </g>
      <circle cx="160" cy="160" r="9" fill="var(--ink)"/>
      <text id="phase" class="phase" x="160" y="120" text-anchor="middle">Klar</text>
      <text id="big" class="big" x="160" y="236" text-anchor="middle">0</text>
      <text class="unit" x="160" y="256" text-anchor="middle">MBIT/S</text>
    </svg>

    <div class="readouts">
      <div class="ro"><span>Ping</span><b id="rPing">–</b><small>ms</small></div>
      <div class="ro"><span>Jitter</span><b id="rJit">–</b><small>ms</small></div>
      <div class="ro dl"><span>Ned</span><b id="rDl">–</b><small>Mbit/s</small></div>
      <div class="ro ul"><span>Opp</span><b id="rUl">–</b><small>Mbit/s</small></div>
    </div>
    <div class="when" id="when">Ingen målinger ennå</div>

    <dl class="info">
      <div><dt>Server</dt><dd id="iSrv">Henter…</dd></div>
      <div><dt>Leverandør</dt><dd id="iIsp">–</dd></div>
      <div><dt>Din IP</dt><dd id="iIp">–</dd></div>
    </dl>

    <div class="controls">
      <button id="go">Start</button>
    </div>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
/* Størrelsen teller v1.6.0  (tidligere Linjemåler)
   1.6.0  Måleren tåler ugyldige verdier (NaN, uendelig, negative): viser 0 i stedet for «NaN» eller fullt utslag.
          Automatiske tester lagt til for måler, tilkobling, ping, nedlasting, opplasting og pauser
   1.5.0  Nytt navn: Størrelsen teller
   1.4.3  Stopp avbryter umiddelbart; 10 s pause etter stopp
   1.4.2  Ping og jitter settes også til 0 ved start
   1.4.1  Ned settes også til 0 ved start
   1.4.0  Jitter (snitt av forskjell mellom påfølgende ping), Opp settes til 0 ved start, større speedometer
   1.3.0  Nål og stort tall går til 0 etter måling; siste resultat beholdes og huskes med tidspunkt
   1.2.2  Tilbake til 25 MB-biter (100 MB feilet), starter på 1 MB og øker, viser feildetaljer
   1.2.1  Tåler enkeltfeil/429 fra Cloudflare, færre forespørsler, pause mellom tester, tydelig feilmelding
   1.2.0  Kun Cloudflare, serverinfo (server, leverandør, IP)
   1.1.0  Fast dark mode, tall flyttet under nåla
   1.0.0  Første versjon: speedometer, ping/ned/opp, sperre for mobilnett */
const VERSION = "1.6.0";
// ---------- Servere ----------
const SRV = {
  name: "Cloudflare",
  ping: () => `https://speed.cloudflare.com/__down?bytes=0&r=${Math.random()}`,
  down: (b) => `https://speed.cloudflare.com/__down?bytes=${b}&r=${Math.random()}`,
  up:   () => `https://speed.cloudflare.com/__up?r=${Math.random()}`
};

// ---------- Serverinfo ----------
async function loadInfo(){
  let info = {};
  try {                                   // JSON med colo, city, clientIp, asOrganization
    const r = await fetch("https://speed.cloudflare.com/meta", {cache:"no-store"});
    if (r.ok) info = await r.json();
  } catch {}
  if (!info.colo) try {                   // reserve: tekstformat fra Cloudflare-trace
    const t = await (await fetch("https://speed.cloudflare.com/cdn-cgi/trace", {cache:"no-store"})).text();
    t.split("\n").forEach(l => { const [k,v] = l.split("="); if (k==="colo") info.colo=v; if (k==="ip") info.clientIp=v; });
  } catch {}
  const place = [info.city, info.colo && `(${info.colo})`].filter(Boolean).join(" ");
  $("iSrv").textContent = "Cloudflare" + (place ? " · " + place : "");
  $("iIsp").textContent = info.asOrganization ? info.asOrganization + (info.asn ? ` · AS${info.asn}` : "") : "Ukjent";
  $("iIp").textContent = info.clientIp || "Ukjent";
}
const STREAMS = 4, UPSTREAMS = 3, DURATION = 10000, CHUNK = 25e6, UPCHUNK = 10e6, COOLDOWN = 20;

// ---------- Måler (ikke-lineær skala) ----------
const MARKS = [0,5,10,25,50,100,250,500,1000];
const A0 = -120, A1 = 120, CX = 160, CY = 160, R = 120;
function valToFrac(v){
  if (!(v > 0)) return 0;                  // NaN (f.eks. 0/0 rett etter start), 0 og negative gir null utslag
  v = Math.min(1000, v);
  for (let i=1;i<MARKS.length;i++) if (v <= MARKS[i]) {
    return (i-1 + (v-MARKS[i-1])/(MARKS[i]-MARKS[i-1]))/(MARKS.length-1);
  }
  return 1;
}
const pt = (deg, r) => { const a=(deg-90)*Math.PI/180; return [CX+r*Math.cos(a), CY+r*Math.sin(a)]; };
function arcPath(f){
  const end = A0 + (A1-A0)*f, [x0,y0]=pt(A0,R), [x1,y1]=pt(end,R);
  return `M${x0} ${y0} A${R} ${R} 0 ${end-A0>180?1:0} 1 ${x1} ${y1}`;
}
document.getElementById("track").setAttribute("d", arcPath(1));
const ticks = document.getElementById("ticks");
MARKS.forEach((m,i)=>{
  const deg = A0 + (A1-A0)*i/(MARKS.length-1), [x,y]=pt(deg, R-26);
  ticks.insertAdjacentHTML("beforeend",
    `<text class="tick" x="${x}" y="${y+4}" text-anchor="middle">${m}</text>`);
});
const $ = id => document.getElementById(id);
function setGauge(v, color){
  if (!(v > 0) || !Number.isFinite(v)) v = 0;   // NaN, uendelig og negative verdier vises som 0
  const f = valToFrac(v);
  $("arc").setAttribute("d", f>0.002 ? arcPath(f) : "");
  if (color) $("arc").setAttribute("stroke", color);
  $("needle").style.transform = `rotate(${A0+(A1-A0)*f}deg)`;
  $("big").textContent = v >= 100 ? Math.round(v) : v.toFixed(1);
}
setGauge(0);

// ---------- Tilkoblingstype ----------
const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
let confirmedFixed = false;
function connState(){
  if (!navigator.onLine) return "offline";
  const t = conn && conn.type;
  if (t === "wifi" || t === "ethernet") return "fixed";
  if (t === "cellular" || t === "wimax" || t === "bluetooth") return "mobile";
  return "unknown";               // f.eks. Safari, Firefox og Chrome på PC rapporterer ikke type
}
function renderStatus(){
  const s = connState(), box = $("status"), txt = $("statusText");
  box.className = "status";
  if (s === "fixed"){
    box.classList.add("ok");
    txt.textContent = conn.type === "wifi" ? "WiFi tilkoblet – klar til test" : "Kablet nett tilkoblet – klar til test";
  } else if (s === "mobile"){
    box.classList.add("bad");
    txt.textContent = "Mobilnett (4G/5G) oppdaget – testen er sperret";
  } else if (s === "offline"){
    box.classList.add("bad");
    txt.textContent = "Ingen nettverkstilkobling";
  } else {
    box.classList.add("warn");
    txt.innerHTML = `Nettleseren oppgir ikke tilkoblingstype.
      <label><input type="checkbox" id="confirm" ${confirmedFixed?"checked":""}> Jeg er på WiFi eller kablet nett</label>`;
    $("confirm").onchange = e => { confirmedFixed = e.target.checked; updateButton(); };
  }
  updateButton();
}
function allowed(){ const s = connState(); return s === "fixed" || (s === "unknown" && confirmedFixed); }
let running = false, abortCtl = null;
function updateButton(){ $("go").disabled = !running && !allowed(); }
conn && conn.addEventListener && conn.addEventListener("change", ()=>{
  renderStatus();
  if (running && connState() === "mobile") abortTest("Byttet til mobilnett – testen ble stoppet.");
});
addEventListener("online", renderStatus); addEventListener("offline", renderStatus);
renderStatus();

// ---------- Måling ----------
function log(msg, err){ const l=$("log"); l.textContent = msg; l.className = "log"+(err?" err":""); }
function abortTest(msg){ if (abortCtl) abortCtl.abort(); log(msg, true); }
const mbps = (bytes, ms) => bytes*8/ms/1000;
const sleep = ms => new Promise(r=>setTimeout(r, ms));
// venter ms, men slutter med en gang hvis testen stoppes
const waitOrAbort = (ms, signal) => new Promise(r=>{
  const t = setTimeout(r, ms);
  signal.addEventListener("abort", ()=>{ clearTimeout(t); r(); }, {once:true});
});
const STOP_COOLDOWN = 10;
const LIMIT_MSG = "Fikk ikke kontakt med Cloudflare. Det skyldes oftest at de begrenser antall tester " +
                  "når man tester mange ganger på kort tid. Vent 1–2 minutter og prøv igjen.";
class LimitError extends Error { constructor(detail){ super(LIMIT_MSG); this.name = "LimitError"; this.detail = detail || ""; } }
const diag = { down:[], up:[] };                          // siste feil per fase, vises ved feil
function note(phase, what){ diag[phase].push(what); if (diag[phase].length > 5) diag[phase].shift(); }

// Kobler en fase-kontroller til hoved-signalet, så ventende forespørsler avbrytes når fasen er ferdig
function phaseCtl(signal){
  const c = new AbortController();
  signal.addEventListener("abort", ()=>c.abort(), {once:true});
  return c;
}

async function measurePing(srv, signal){
  const times = [];
  for (let i=0;i<14 && times.length<11;i++){
    try {
      const t0 = performance.now();
      const r = await fetch(srv.ping(), {cache:"no-store", signal});
      await r.arrayBuffer();
      if (r.ok) times.push(performance.now()-t0);
    } catch (e) {
      if (e.name === "AbortError") throw e;
      await sleep(400);
    }
  }
  if (times.length < 3) throw new LimitError("Ping: fikk ikke svar");
  const t = times.slice(1);                            // første inkluderer oppkobling, forkastes
  const sorted = [...t].sort((a,b)=>a-b);
  const ping = sorted[Math.floor(sorted.length/2)];    // median
  let sum = 0;                                         // jitter: snitt av forskjell mellom påfølgende målinger
  for (let i=1;i<t.length;i++) sum += Math.abs(t[i]-t[i-1]);
  return { ping, jitter: sum/(t.length-1) };
}

async function measureDown(srv, signal){
  const ctl = phaseCtl(signal);
  let bytes = 0, stop = false; const t0 = performance.now();
  const worker = async () => {
    let size = 1e6;                                     // start med 1 MB og øk opp til CHUNK
    while (!stop){
      try {
        const r = await fetch(srv.down(size), {cache:"no-store", signal: ctl.signal});
        if (!r.ok) { await r.body?.cancel(); throw new Error("HTTP "+r.status+" ved "+(size/1e6)+" MB"); }
        const rd = r.body.getReader();
        while (!stop){
          const {done, value} = await rd.read();
          if (done) break;
          bytes += value.length;
        }
        size = Math.min(size*5, CHUNK);
      } catch (e) {
        if (stop || signal.aborted) return;
        note("down", e.name === "TypeError" ? "nettverksfeil ved "+(size/1e6)+" MB" : e.message);
        size = 1e6;
        await sleep(800);                              // én strøm feilet: vent litt og prøv igjen
      }
    }
  };
  const tick = setInterval(()=>{ const v=mbps(bytes, performance.now()-t0); setGauge(v); $("rDl").textContent=v.toFixed(1); }, 150);
  const workers = Array.from({length:STREAMS}, worker);
  await waitOrAbort(DURATION, signal);
  stop = true; clearInterval(tick); ctl.abort();
  await Promise.allSettled(workers);
  if (signal.aborted) throw new DOMException("Avbrutt","AbortError");
  if (bytes === 0) throw new LimitError("Nedlasting: " + (diag.down.slice(-3).join("; ") || "ingen data mottatt"));
  return mbps(bytes, performance.now()-t0);
}

function measureUp(srv, signal){
  return new Promise((resolve, reject)=>{
    const payload = new Blob([crypto.getRandomValues(new Uint8Array(65536))]);
    const blob = new Blob(Array(Math.ceil(UPCHUNK/65536)).fill(payload));
    const t0 = performance.now(); let done = 0, stop = false; const live = new Map(); const xhrs = new Set();
    const total = () => { let s = done; live.forEach(v=>s+=v); return s; };
    const send = (id) => {
      if (stop) return;
      const x = new XMLHttpRequest(); xhrs.add(x);
      x.open("POST", srv.up());
      x.upload.onprogress = e => live.set(id, e.loaded);
      x.onload = () => {
        xhrs.delete(x); live.delete(id);
        if (x.status >= 200 && x.status < 300) { done += blob.size; send(id); }
        else { note("up", "HTTP "+x.status); setTimeout(()=>send(id), 800); }
      };
      x.onerror = () => { xhrs.delete(x); live.delete(id); if (!stop){ note("up","nettverksfeil"); setTimeout(()=>send(id), 800); } };
      x.send(blob);
    };
    const tick = setInterval(()=>{ const v=mbps(total(), performance.now()-t0); setGauge(v); $("rUl").textContent=v.toFixed(1); }, 150);
    const finish = () => { stop = true; clearInterval(tick); xhrs.forEach(x=>x.abort()); };
    signal.addEventListener("abort", ()=>{ finish(); reject(new DOMException("Avbrutt","AbortError")); }, {once:true});
    for (let i=0;i<UPSTREAMS;i++) send(i);
    setTimeout(()=>{
      const sent = total(), r = mbps(sent, performance.now()-t0); finish();
      sent > 0 ? resolve(r) : reject(new LimitError("Opplasting: " + (diag.up.slice(-3).join("; ") || "ingen data sendt")));
    }, DURATION);
  });
}

async function runTest(){
  const srv = SRV; abortCtl = new AbortController(); const sig = abortCtl.signal;
  $("phase").textContent = "Ping"; log(""); $("when").textContent = "Måler…";
  const {ping, jitter} = await measurePing(srv, sig);
  $("rPing").textContent = Math.round(ping); $("rJit").textContent = jitter.toFixed(1);
  $("phase").textContent = "Nedlasting"; setGauge(0, "var(--dl)");
  const dl = await measureDown(srv, sig); $("rDl").textContent = dl.toFixed(1);
  if (!allowed()) throw new Error("Tilkoblingen er ikke lenger WiFi/kabel");
  $("phase").textContent = "Opplasting"; setGauge(0, "var(--ul)");
  const ul = await measureUp(srv, sig); $("rUl").textContent = ul.toFixed(1);
  $("phase").textContent = "Ferdig"; setGauge(0, "var(--dl)");   // nåla og stort tall tilbake til 0
  saveLast({ping, jitter, dl, ul, t: Date.now()});
  showLast();
}

// ---------- Siste måling (huskes også når siden åpnes på nytt) ----------
let last = null;
try { last = JSON.parse(localStorage.getItem("linjemaler.last")); } catch {}
function saveLast(r){ last = r; try { localStorage.setItem("linjemaler.last", JSON.stringify(r)); } catch {} }
function showLast(){
  if (!last){
    ["rPing","rJit","rDl","rUl"].forEach(id=>$(id).textContent="–");
    $("when").textContent = "Ingen målinger ennå"; return;
  }
  $("rPing").textContent = Math.round(last.ping);
  $("rJit").textContent = last.jitter != null ? last.jitter.toFixed(1) : "–";
  $("rDl").textContent = last.dl.toFixed(1);
  $("rUl").textContent = last.ul.toFixed(1);
  const d = new Date(last.t), today = d.toDateString() === new Date().toDateString();
  $("when").textContent = "Siste måling " + (today ? "i dag " : d.toLocaleDateString("no-NO") + " ") +
    "kl. " + d.toLocaleTimeString("no-NO", {hour:"2-digit", minute:"2-digit"});
}
showLast();
loadInfo();

// Pause mellom tester, så Cloudflare ikke begrenser oss
let cooldownUntil = 0;
function startCooldown(sec){
  cooldownUntil = Date.now() + sec*1000;
  const t = setInterval(()=>{
    const left = Math.ceil((cooldownUntil - Date.now())/1000);
    if (left <= 0 || running){ clearInterval(t); $("go").textContent = running ? "Stopp" : "Start"; updateButton(); return; }
    $("go").textContent = `Klar om ${left} s`; $("go").disabled = true;
  }, 250);
}

$("go").onclick = async () => {
  if (running){ abortTest("Testen ble stoppet."); return; }
  if (!allowed() || Date.now() < cooldownUntil) return;
  running = true; $("go").textContent = "Stopp";
  diag.down = []; diag.up = [];
  $("rPing").textContent = "0"; $("rJit").textContent = "0.0";
  $("rDl").textContent = "0.0"; $("rUl").textContent = "0.0";   // alle står på 0 til de er målt
  let cool = COOLDOWN;
  try {
    await runTest();
  } catch (e) {
    if (e.name === "AbortError") { cool = STOP_COOLDOWN; }
    else if (e.name === "LimitError" || e instanceof TypeError) { log(LIMIT_MSG + (e.detail ? "\nDetaljer: " + e.detail : ""), true); cool = 60; }
    else log("Feil: "+e.message, true);
  } finally {
    running = false; $("go").textContent = "Start";
    if ($("phase").textContent !== "Ferdig") { $("phase").textContent = "Klar"; setGauge(0); showLast(); }
    updateButton(); startCooldown(cool);
  }
};
</script>
</body>
</html>
